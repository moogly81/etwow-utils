<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  // Jekyll renders ```mermaid fences as <pre><code class="language-mermaid">
  // (or div.language-mermaid with rouge). Replace them with <pre class="mermaid">.
  document.querySelectorAll("pre > code.language-mermaid, div.language-mermaid").forEach((el) => {
    const target = el.closest("pre") || el;
    const pre = document.createElement("pre");
    pre.className = "mermaid";
    pre.textContent = el.textContent;
    target.replaceWith(pre);
  });
  mermaid.initialize({ startOnLoad: false });
  await mermaid.run();
</script>
